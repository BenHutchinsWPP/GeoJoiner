<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoJoiner — Not Found</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8f9fa; color: #333; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; }
    a { color: #3498db; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>This page isn't part of GeoJoiner.</p>
  <p><a href=".">Go to GeoJoiner</a></p>
  <script>
    // Redirect to the app root — preserves query/hash if any
    var base = document.querySelector('base')?.href || '.';
    sessionStorage.setItem('geo404', window.location.href);
    window.location.replace(base);
  </script>
</body>
</html>
